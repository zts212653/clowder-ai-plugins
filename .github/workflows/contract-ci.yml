name: Contract CI

env:
  ARTIFACT_NODE_VERSION: '24.18.0'
  ARTIFACT_NPM_VERSION: '11.16.0'
  ARTIFACT_ZLIB_VERSION: '1.3.1-e00f703'

on:
  pull_request: {}
  push:
    branches: [main]
    paths:
      - 'packages/plugin-contract/**'
      - 'packages/plugin-sdk/**'
      - 'packages/feishu-meeting-intake/**'
      - 'scripts/fresh-consumer-install.test.mjs'
      - 'scripts/pack-publish-artifact.mjs'
      - 'package.json'
      - '.npmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/contract-ci.yml'
      - '.github/actions/publish-prerelease/**'

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: contract-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck + Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ARTIFACT_NODE_VERSION }}
          cache: 'pnpm'

      - name: Verify artifact toolchain
        run: node packages/plugin-contract/scripts/verify-artifact-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated contract freshness
        run: pnpm --filter @clowder-ai/plugin-contract generate:check

      - name: Typecheck
        run: pnpm --filter @clowder-ai/plugin-contract typecheck

      - name: Unit tests
        run: pnpm --filter @clowder-ai/plugin-contract test

      - name: Build
        run: pnpm --filter @clowder-ai/plugin-contract build

      - name: SDK typecheck
        run: pnpm --filter @clowder-ai/plugin-sdk typecheck

      - name: SDK unit tests
        run: pnpm --filter @clowder-ai/plugin-sdk test

      - name: SDK build
        run: pnpm --filter @clowder-ai/plugin-sdk build

      - name: Feishu intake typecheck
        run: pnpm --filter @clowder-ai/feishu-meeting-intake typecheck

      - name: Feishu intake tests
        run: pnpm --filter @clowder-ai/feishu-meeting-intake test

      - name: Feishu intake lint
        run: pnpm --filter @clowder-ai/feishu-meeting-intake lint

      - name: Feishu intake build
        run: pnpm --filter @clowder-ai/feishu-meeting-intake build

      - name: Fresh consumer install
        run: pnpm test:fresh-consumer

      - name: Loopback fixture typecheck
        run: pnpm --filter @clowder-ai/loopback-fixture-plugin typecheck

      - name: Loopback fixture tests
        run: pnpm --filter @clowder-ai/loopback-fixture-plugin test

      - name: Loopback fixture lint
        run: pnpm --filter @clowder-ai/loopback-fixture-plugin lint

      - name: Loopback fixture build
        run: pnpm --filter @clowder-ai/loopback-fixture-plugin build

      - name: Conformance runner
        run: pnpm --filter @clowder-ai/plugin-contract conformance

      - name: Capture exact-head pack evidence
        working-directory: packages/plugin-contract
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PACK_EVIDENCE_PATH: ${{ runner.temp }}/plugin-contract-pack-evidence.json
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA=$(git rev-parse HEAD)
          export ACTUAL_HEAD_SHA
          if [[ "$ACTUAL_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]]; then
            echo "checkout HEAD mismatch: $ACTUAL_HEAD_SHA != $EXPECTED_HEAD_SHA" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "tracked files changed before pack evidence capture" >&2
            git status --short >&2
            exit 1
          fi

          PACK_JSON_PATH="$RUNNER_TEMP/plugin-contract-pack.json"
          export PACK_JSON_PATH
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$PACK_JSON_PATH"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';

          const [artifact] = JSON.parse(readFileSync(process.env.PACK_JSON_PATH, 'utf8'));
          const stringFields = ['name', 'version', 'filename', 'integrity', 'shasum'];
          const numberFields = ['size', 'unpackedSize'];
          for (const field of stringFields) {
            if (typeof artifact?.[field] !== 'string' || artifact[field].length === 0) {
              throw new Error(`npm pack did not report ${field}`);
            }
          }
          for (const field of numberFields) {
            if (!Number.isFinite(artifact?.[field]) || artifact[field] <= 0) {
              throw new Error(`npm pack did not report ${field}`);
            }
          }
          if (!Array.isArray(artifact?.files) || artifact.files.length === 0) {
            throw new Error('npm pack did not report files');
          }

          const evidence = {
            headSha: process.env.ACTUAL_HEAD_SHA,
            name: artifact.name,
            version: artifact.version,
            filename: artifact.filename,
            integrity: artifact.integrity,
            shasum: artifact.shasum,
            size: artifact.size,
            unpackedSize: artifact.unpackedSize,
            entryCount: artifact.files?.length,
            toolchain: {
              node: process.version,
              npm: execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(),
              zlib: process.versions.zlib,
            },
          };
          writeFileSync(process.env.PACK_EVIDENCE_PATH, `${JSON.stringify(evidence, null, 2)}\n`);
          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### Exact-head pack evidence\n\n\`\`\`json\n${JSON.stringify(evidence, null, 2)}\n\`\`\`\n`,
          );
          NODE

      - name: Verify immutable published package identity
        working-directory: packages/plugin-contract
        env:
          PACK_JSON_PATH: ${{ runner.temp }}/plugin-contract-pack.json
          REGISTRY_JSON_PATH: ${{ runner.temp }}/plugin-contract-existing-registry.json
          REGISTRY_ERROR_PATH: ${{ runner.temp }}/plugin-contract-existing-registry.err
        run: |
          set -euo pipefail
          PACKAGE_NAME=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [artifact] = JSON.parse(readFileSync(process.env.PACK_JSON_PATH, 'utf8'));
          if (typeof artifact?.name !== 'string' || artifact.name.length === 0) {
            throw new Error('npm pack did not report package name');
          }
          process.stdout.write(artifact.name);
          NODE
          )
          PACKAGE_VERSION=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [artifact] = JSON.parse(readFileSync(process.env.PACK_JSON_PATH, 'utf8'));
          if (typeof artifact?.version !== 'string' || artifact.version.length === 0) {
            throw new Error('npm pack did not report package version');
          }
          process.stdout.write(artifact.version);
          NODE
          )
          EXPECTED_INTEGRITY=$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const [artifact] = JSON.parse(readFileSync(process.env.PACK_JSON_PATH, 'utf8'));
          if (typeof artifact?.integrity !== 'string' || artifact.integrity.length === 0) {
            throw new Error('npm pack did not report package integrity');
          }
          process.stdout.write(artifact.integrity);
          NODE
          )
          export PACKAGE_NAME PACKAGE_VERSION EXPECTED_INTEGRITY

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" --json > "$REGISTRY_JSON_PATH" 2> "$REGISTRY_ERROR_PATH"; then
            node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync(process.env.REGISTRY_JSON_PATH, 'utf8'));
          if (metadata.version !== process.env.PACKAGE_VERSION) {
            throw new Error(`registry version mismatch: ${metadata.version}`);
          }
          if (metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY) {
            throw new Error(`immutable registry integrity mismatch: ${metadata.dist?.integrity}`);
          }
          NODE
          elif grep -q 'E404' "$REGISTRY_ERROR_PATH"; then
            echo "No published $PACKAGE_NAME@$PACKAGE_VERSION; release publication remains eligible."
          else
            cat "$REGISTRY_ERROR_PATH" >&2
            exit 1
          fi

      - name: Upload exact-head pack evidence
        uses: actions/upload-artifact@v4
        with:
          name: plugin-contract-pack-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/plugin-contract-pack-evidence.json
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ARTIFACT_NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify artifact toolchain
        run: node packages/plugin-contract/scripts/verify-artifact-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm --filter @clowder-ai/plugin-contract build

      - name: Build SDK package
        run: pnpm --filter @clowder-ai/plugin-sdk build

      - name: Build Feishu intake package
        run: pnpm --filter @clowder-ai/feishu-meeting-intake build

      - name: Publish contract prerelease
        uses: ./.github/actions/publish-prerelease
        with:
          package-directory: packages/plugin-contract
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Publish SDK prerelease
        uses: ./.github/actions/publish-prerelease
        with:
          package-directory: packages/plugin-sdk
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Publish Feishu intake prerelease
        uses: ./.github/actions/publish-prerelease
        with:
          package-directory: packages/feishu-meeting-intake
          npm-token: ${{ secrets.NPM_TOKEN }}
