name: Contract CI — GitHub Operations alpha.44 recovery

on:
  workflow_dispatch: {}

env:
  ARTIFACT_NODE_VERSION: '24.18.0'
  ARTIFACT_NPM_VERSION: '11.16.0'
  ARTIFACT_ZLIB_VERSION: '1.3.1-e00f703'
  PRODUCT_SOURCE_HEAD: '5cd5e4a9a42f73c8f2e80febe448917215da2950'
  EXPECTED_PACKAGE_NAME: '@clowder-ai/github-operations'
  EXPECTED_PACKAGE_VERSION: '0.1.0-alpha.44'
  EXPECTED_INTEGRITY: 'sha512-7JwH4K13Uu9V+V7sMMxN/X2tIW1ap9UNklIeBl9onKZKSLO7xOuPgNSA8mvYM/+l+o4bTMAdlAZb7dEj6NhO9w=='
  EXPECTED_SHASUM: 'aa87f287ea919fec4df6885c7cc4cecba820c4c1'

permissions:
  contents: read
  id-token: write

concurrency:
  group: github-operations-alpha44-recovery
  cancel-in-progress: false

jobs:
  publish:
    name: Publish only GitHub Operations alpha.44
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.ARTIFACT_NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Bind actual signing head to the frozen product source
        shell: bash
        run: |
          set -euo pipefail
          signing_head="$(git rev-parse HEAD)"
          printf 'productSourceHead=%s\nactualSigningHead=%s\n' "$PRODUCT_SOURCE_HEAD" "$signing_head"
          git diff --exit-code "$PRODUCT_SOURCE_HEAD" -- \
            packages catalog scripts pnpm-lock.yaml package.json .npmrc .github/actions/publish-prerelease
          workflow_delta="$(git diff --name-only "$PRODUCT_SOURCE_HEAD" -- .github/workflows)"
          test "$workflow_delta" = '.github/workflows/contract-ci.yml'
          printf 'permittedWorkflowDelta=%s\n' "$workflow_delta"

      - name: Verify approved package and catalog identities
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('packages/github-operations/package.json', 'utf8'));
          const manifest = readFileSync('packages/github-operations/plugin.yaml', 'utf8');
          const candidate = JSON.parse(readFileSync('catalog/candidate.json', 'utf8'));
          const plans = JSON.parse(readFileSync('catalog/release-plans.json', 'utf8'));
          const version = candidate.plugins.find((p) => p.pluginId === 'official.github-operations')
            .versions.find((v) => v.version === process.env.EXPECTED_PACKAGE_VERSION);
          const plan = plans.releases.find((p) => p.pluginId === 'official.github-operations' && p.version === process.env.EXPECTED_PACKAGE_VERSION);
          if (pkg.name !== process.env.EXPECTED_PACKAGE_NAME || pkg.version !== process.env.EXPECTED_PACKAGE_VERSION) {
            throw new Error(`package identity mismatch: ${pkg.name}@${pkg.version}`);
          }
          if (!manifest.includes(`version: ${process.env.EXPECTED_PACKAGE_VERSION}`)) {
            throw new Error('plugin.yaml version mismatch');
          }
          if (version?.artifact?.integrity !== process.env.EXPECTED_INTEGRITY ||
              version?.artifact?.shasum !== process.env.EXPECTED_SHASUM ||
              plan?.integrity !== process.env.EXPECTED_INTEGRITY) {
            throw new Error('approved catalog identity mismatch');
          }
          NODE

      - name: Verify artifact toolchain
        run: node packages/plugin-contract/scripts/verify-artifact-toolchain.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only required packages
        run: |
          set -euo pipefail
          pnpm --filter @clowder-ai/plugin-contract build
          pnpm --filter @clowder-ai/plugin-sdk build
          pnpm --filter @clowder-ai/github-operations build

      - name: Reject a wrong pre-upload artifact against the approved tuple
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pack-publish-artifact.mjs packages/github-operations "$RUNNER_TEMP/preupload" > "$RUNNER_TEMP/preupload.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const [artifact] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/preupload.json`, 'utf8'));
          if (artifact.name !== process.env.EXPECTED_PACKAGE_NAME ||
              artifact.version !== process.env.EXPECTED_PACKAGE_VERSION ||
              artifact.integrity !== process.env.EXPECTED_INTEGRITY ||
              artifact.shasum !== process.env.EXPECTED_SHASUM) {
            throw new Error(`pre-upload artifact mismatch: ${JSON.stringify({
              name: artifact.name,
              version: artifact.version,
              integrity: artifact.integrity,
              shasum: artifact.shasum,
            })}`);
          }
          console.log(`pre-upload artifact accepted: ${artifact.name}@${artifact.version} ${artifact.integrity} ${artifact.shasum}`);
          NODE

      - name: Publish GitHub Operations prerelease through the native OIDC action
        uses: ./.github/actions/publish-prerelease
        with:
          package-directory: packages/github-operations
          npm-token: ''

      - name: Verify exact published SRI, SHA-1 and tags
        shell: bash
        run: |
          set -euo pipefail
          npm view "$EXPECTED_PACKAGE_NAME@$EXPECTED_PACKAGE_VERSION" --json > "$RUNNER_TEMP/alpha44.json"
          npm view "$EXPECTED_PACKAGE_NAME" dist-tags --json > "$RUNNER_TEMP/alpha44-tags.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const metadata = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/alpha44.json`, 'utf8'));
          const tags = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/alpha44-tags.json`, 'utf8'));
          if (metadata.version !== process.env.EXPECTED_PACKAGE_VERSION) {
            throw new Error(`registry version mismatch: ${metadata.version}`);
          }
          if (metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY) {
            throw new Error(`registry SRI mismatch: ${metadata.dist?.integrity}`);
          }
          if (metadata.dist?.shasum !== process.env.EXPECTED_SHASUM) {
            throw new Error(`registry SHA-1 mismatch: ${metadata.dist?.shasum}`);
          }
          if (tags.next !== process.env.EXPECTED_PACKAGE_VERSION) {
            throw new Error(`registry next mismatch: ${tags.next}`);
          }
          console.log(JSON.stringify({ version: metadata.version, integrity: metadata.dist.integrity, shasum: metadata.dist.shasum, tags }, null, 2));
          NODE
