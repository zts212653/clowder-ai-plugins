name: Feedback package OIDC authorization probe

on:
  push:
    branches:
      - diag/feedback-oidc-20261112

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'zts212653/clowder-ai-plugins' && github.actor == 'zts212653'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Probe two package OIDC exchanges without publishing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const expectedRepo = 'zts212653/clowder-ai-plugins';
            const expectedRef = 'refs/heads/diag/feedback-oidc-20261112';
            if (process.env.GITHUB_REPOSITORY !== expectedRepo || process.env.GITHUB_REF !== expectedRef) throw new Error('Unexpected repository/ref');
            const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            requestUrl.searchParams.set('audience', 'npm:registry.npmjs.org');
            const identityResponse = await fetch(requestUrl, { headers: { Authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN } });
            if (!identityResponse.ok) throw new Error('GitHub identity request failed: HTTP ' + identityResponse.status);
            const identity = await identityResponse.json();
            if (typeof identity.value !== 'string') throw new Error('GitHub identity token missing');
            const claims = JSON.parse(Buffer.from(identity.value.split('.')[1], 'base64url'));
            const expectedWorkflow = expectedRepo + '/.github/workflows/contract-ci.yml@';
            if (claims.repository !== expectedRepo || !claims.workflow_ref.startsWith(expectedWorkflow)) throw new Error('Unexpected workflow identity');
            const safe = (value) => typeof value === 'string' ? value.replace(/https?:\/\/\S+/g, '[URL]').replace(/[A-Za-z0-9_~+\/-]{48,}/g, '[redacted]').slice(0, 300) : null;
            const results = [];
            for (const packageName of ['@clowder-ai/feedback', '@clowder-ai/xiangqi']) {
              const response = await fetch('https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/' + encodeURIComponent(packageName), {
                method: 'POST', headers: { Authorization: 'Bearer ' + identity.value }, redirect: 'error',
              });
              const result = await response.json().catch(() => ({}));
              const accepted = response.ok && typeof result.token === 'string' && result.token.length > 0;
              results.push({ package: packageName, status: response.status, accepted, errorCode: safe(result.code), errorMessage: accepted ? null : safe(result.error || result.message) });
            }
            const receipt = { repository: claims.repository, workflowRef: claims.workflow_ref, sourceRun: process.env.GITHUB_RUN_ID, published: false, credentialsPersisted: false, results };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/feedback-oidc-probe.json', JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
            console.log(JSON.stringify(receipt));
            if (results.some(result => !result.accepted)) process.exitCode = 1;
          })().catch((error) => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Inspect existing fallback credential with GET-only registry requests
        if: always()
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const credential = process.env.NPM_TOKEN;
          delete process.env.NPM_TOKEN;
          (async () => {
            if (!credential) throw new Error('Existing fallback credential is not configured');
            const results = [];
            for (const packageName of ['@clowder-ai/feedback', '@clowder-ai/xiangqi']) {
              const path = '/-/package/' + encodeURIComponent(packageName) + '/trust';
              const response = await fetch('https://registry.npmjs.org' + path, {
                method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { authorization: 'Bearer ' + credential, accept: 'application/json' },
              });
              const body = response.ok ? await response.json() : null;
              const entries = Array.isArray(body) ? body : (body?.configs || body?.trustedPublishers || body?.items || []);
              results.push({ package: packageName, trustListStatus: response.status, configurationCount: Array.isArray(entries) ? entries.length : null });
            }
            const identityResponse = await fetch('https://registry.npmjs.org/-/whoami', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { authorization: 'Bearer ' + credential, accept: 'application/json' },
            });
            const scopeResponse = await fetch('https://registry.npmjs.org/-/org/clowder-ai/package', {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { authorization: 'Bearer ' + credential, accept: 'application/json' },
            });
            const scopeBody = scopeResponse.ok ? await scopeResponse.json() : null;
            const scope = { status: scopeResponse.status, feedbackListed: scopeBody ? Object.hasOwn(scopeBody, '@clowder-ai/feedback') : null, xiangqiListed: scopeBody ? Object.hasOwn(scopeBody, '@clowder-ai/xiangqi') : null };
            const receipt = { method: 'GET only', credentialPersisted: false, sourceRun: process.env.GITHUB_RUN_ID, identityStatus: identityResponse.status, scope, results };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/feedback-trust-read.json', JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
            console.log(JSON.stringify(receipt));
          })().catch(() => { console.error('Read-only registry probe failed'); process.exitCode = 1; });
          NODE
      - name: Upload credential-free proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-oidc-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/feedback-oidc-probe.json
            ${{ runner.temp }}/feedback-trust-read.json
          if-no-files-found: warn
