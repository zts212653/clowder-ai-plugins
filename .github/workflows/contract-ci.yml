name: Contract CI

on:
  pull_request:
    paths:
      - 'packages/plugin-contract/**'
      - '.npmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/CODEOWNERS'
      - '.github/workflows/contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/plugin-contract/**'

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: contract-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck + Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated contract freshness
        run: pnpm --filter @clowder-ai/plugin-contract generate:check

      - name: Typecheck
        run: pnpm --filter @clowder-ai/plugin-contract typecheck

      - name: Unit tests
        run: pnpm --filter @clowder-ai/plugin-contract test

      - name: Build
        run: pnpm --filter @clowder-ai/plugin-contract build

      - name: Conformance runner
        run: pnpm --filter @clowder-ai/plugin-contract conformance

  publish:
    name: Publish to npm
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm --filter @clowder-ai/plugin-contract build

      - name: Publish v0.1 contract
        run: pnpm --filter @clowder-ai/plugin-contract publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
