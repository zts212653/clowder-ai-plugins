name: F292 exact package trusted-publisher proof

'on':
  push:
    branches:
      - diag/f292-alpha12-oidc-probe

permissions:
  contents: read

jobs:
  proof:
    if: >-
      github.repository == 'zts212653/clowder-ai-plugins' &&
      github.actor == 'zts212653'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Exchange workflow OIDC without publishing
        env:
          EXPECTED_REF: refs/heads/diag/f292-alpha12-oidc-probe
          PACKAGE_NAME: '@clowder-ai/feishu-meeting-intake'
          RECEIPT_PATH: ${{ runner.temp }}/f292-alpha12-oidc-proof.json
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            if (process.env.GITHUB_REPOSITORY !== 'zts212653/clowder-ai-plugins') {
              throw new Error('Unexpected repository');
            }
            if (process.env.GITHUB_REF !== process.env.EXPECTED_REF) {
              throw new Error('Unexpected branch ref');
            }

            const identityUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            identityUrl.searchParams.set('audience', 'npm:registry.npmjs.org');
            const identityResponse = await fetch(identityUrl, {
              headers: {
                Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}`,
              },
            });
            if (!identityResponse.ok) {
              throw new Error(`GitHub OIDC identity request failed: ${identityResponse.status}`);
            }

            const identityBody = await identityResponse.json();
            const idToken = identityBody.value;
            if (typeof idToken !== 'string') {
              throw new Error('GitHub identity response has no token');
            }
            const claims = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64url'));
            const workflowPrefix =
              'zts212653/clowder-ai-plugins/.github/workflows/contract-ci.yml@';
            if (
              claims.repository !== 'zts212653/clowder-ai-plugins' ||
              !claims.workflow_ref.startsWith(workflowPrefix)
            ) {
              throw new Error('Wrong workflow identity');
            }

            const exchangeResponse = await fetch(
              'https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/' +
                encodeURIComponent(process.env.PACKAGE_NAME),
              {
                method: 'POST',
                headers: { Authorization: `Bearer ${idToken}` },
              },
            );
            const exchangeBody = await exchangeResponse.json();
            const accepted =
              exchangeResponse.ok &&
              typeof exchangeBody.token === 'string' &&
              exchangeBody.token.length > 0;
            const receipt = {
              repository: claims.repository,
              workflowRef: claims.workflow_ref,
              sourceRun: process.env.GITHUB_RUN_ID,
              credentialsPersisted: false,
              published: false,
              package: process.env.PACKAGE_NAME,
              status: exchangeResponse.status,
              accepted,
              created: exchangeBody.created ?? null,
              expires: exchangeBody.expires ?? null,
              errorCode: accepted ? null : (exchangeBody.code ?? null),
              errorMessage: accepted
                ? null
                : (exchangeBody.message ?? exchangeBody.error ?? null),
            };
            fs.writeFileSync(
              process.env.RECEIPT_PATH,
              JSON.stringify(receipt, null, 2) + '\n',
            );
            console.log(
              JSON.stringify({
                package: receipt.package,
                status: receipt.status,
                oidcExchangeAccepted: receipt.accepted,
              }),
            );
            if (!accepted) {
              throw new Error('Package OIDC exchange was not accepted');
            }
          })().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Upload credential-free proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f292-alpha12-oidc-proof-${{ github.sha }}
          path: ${{ runner.temp }}/f292-alpha12-oidc-proof.json
          if-no-files-found: error
          retention-days: 7
