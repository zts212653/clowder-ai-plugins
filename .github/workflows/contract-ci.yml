name: Feedback recovery channel test
on:
  push:
    branches: [diag/feedback-oidc-20261112]
permissions:
  contents: read
jobs:
  test:
    if: github.repository == 'zts212653/clowder-ai-plugins' && github.actor == 'zts212653'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Start synthetic challenge process
        run: python3 .github/feedback-recovery/challenge.py launch mock
      - name: Upload encrypted synthetic challenge
        uses: actions/upload-artifact@v4
        with:
          name: feedback-recovery-mock-${{ github.run_id }}
          path: ${{ runner.temp }}/feedback-recovery/challenge.enc
          retention-days: 1
          if-no-files-found: error
      - name: Wait for mock process
        run: python3 .github/feedback-recovery/challenge.py wait mock
