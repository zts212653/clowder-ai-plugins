name: Personal Chrome Companion CI

on:
  pull_request:
    paths:
      - 'packages/personal-chrome-companion/**'
      - 'scripts/fresh-consumer-install.test.mjs'
      - 'scripts/pack-publish-artifact.mjs'
      - 'package.json'
      - '.npmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/personal-chrome-companion-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/personal-chrome-companion/**'
      - 'scripts/fresh-consumer-install.test.mjs'
      - 'scripts/pack-publish-artifact.mjs'
      - 'package.json'
      - '.npmrc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/personal-chrome-companion-ci.yml'

concurrency:
  group: personal-chrome-companion-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck + Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Companion typecheck
        run: pnpm --filter @clowder-ai/personal-chrome-companion typecheck

      - name: Companion unit and boundary tests
        run: pnpm --filter @clowder-ai/personal-chrome-companion test

      - name: Companion lint
        run: pnpm --filter @clowder-ai/personal-chrome-companion lint

      - name: Companion build
        run: pnpm --filter @clowder-ai/personal-chrome-companion build

      - name: Fresh consumer closure
        run: pnpm test:fresh-consumer
