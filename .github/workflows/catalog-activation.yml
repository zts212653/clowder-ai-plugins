name: Catalog Activation Audit

on:
  workflow_dispatch: {}
  # Manual npm publication bypasses Contract CI's publish job. Audit that path
  # too, without publishing packages or modifying repository contents.
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read
  issues: write

# A manual audit and the daily audit share one reminder writer. Never cancel a
# writer between its issue read and create/update operation.
concurrency:
  group: catalog-release-follow-up
  cancel-in-progress: false

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clowder-ai/plugin-contract build
      - name: Remind release owners without failing on pending activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm catalog:release-audit -- --notify
