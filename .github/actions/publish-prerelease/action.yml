name: Publish verified prerelease
description: Pack, publish, and verify one immutable public prerelease without explicitly promoting latest

inputs:
  package-directory:
    description: Repository-relative public package directory
    required: true
  retained-artifact:
    description: Authenticated retained SDK/contract archive, when publishing an existing pinned dependency
    required: false
    default: ''
  npm-token:
    description: npm automation token
    required: true

runs:
  using: composite
  steps:
    - name: Pack release candidate
      id: pack
      shell: bash
      env:
        PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        RETAINED_ARTIFACT: ${{ inputs.retained-artifact }}
        PACK_JSON_PATH: ${{ runner.temp }}/prerelease-pack.json
      run: |
        set -euo pipefail
        if [[ ! "$PACKAGE_DIRECTORY" =~ ^packages/[a-z0-9-]+$ ]]; then
          echo "invalid package directory: $PACKAGE_DIRECTORY" >&2
          exit 1
        fi

        if [[ -n "$RETAINED_ARTIFACT" ]]; then
          node scripts/prepare-retained-publish-artifact.mjs "$PACKAGE_DIRECTORY" "$RETAINED_ARTIFACT" "$RUNNER_TEMP" > "$PACK_JSON_PATH"
        else
          node scripts/pack-publish-artifact.mjs "$PACKAGE_DIRECTORY" "$RUNNER_TEMP" > "$PACK_JSON_PATH"
        fi
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';
        import { join } from 'node:path';

        const [artifact] = JSON.parse(readFileSync(process.env.PACK_JSON_PATH, 'utf8'));
        const packageJson = JSON.parse(
          readFileSync(join(process.env.PACKAGE_DIRECTORY, 'package.json'), 'utf8'),
        );
        for (const field of ['name', 'version', 'filename', 'integrity']) {
          if (typeof artifact?.[field] !== 'string' || artifact[field].length === 0) {
            throw new Error(`npm pack did not report ${field}`);
          }
        }
        const retained = process.env.RETAINED_ARTIFACT !== '';
        if (artifact.name !== packageJson.name ||
            (retained ? artifact.retained !== true : artifact.version !== packageJson.version)) {
          throw new Error(
            `packed identity mismatch: ${artifact.name}@${artifact.version} != ${packageJson.name}@${packageJson.version}`,
          );
        }
        if (!artifact.version.includes('-')) {
          throw new Error(`stable publication is not authorized: ${artifact.version}`);
        }

        appendFileSync(
          process.env.GITHUB_OUTPUT,
          [
            `name=${artifact.name}`,
            `version=${artifact.version}`,
            `filename=${artifact.filename}`,
            `integrity=${artifact.integrity}`,
          ].join('\n') + '\n',
        );
        NODE

    - name: Inspect registry before publish
      id: registry
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.pack.outputs.name }}
        PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        PACKAGE_TAGS_PATH: ${{ runner.temp }}/prerelease-existing-tags.json
        PACKAGE_TAGS_ERROR_PATH: ${{ runner.temp }}/prerelease-existing-tags.err
        VERSION_METADATA_PATH: ${{ runner.temp }}/prerelease-existing-version.json
        VERSION_METADATA_ERROR_PATH: ${{ runner.temp }}/prerelease-existing-version.err
      run: |
        set -euo pipefail
        if npm view "$PACKAGE_NAME" dist-tags --json > "$PACKAGE_TAGS_PATH" 2> "$PACKAGE_TAGS_ERROR_PATH"; then
          PREVIOUS_LATEST=$(node packages/plugin-contract/scripts/classify-prerelease-latest.mjs)
          printf 'had_previous_latest=%s\n' "$([[ -n "$PREVIOUS_LATEST" ]] && printf true || printf false)" >> "$GITHUB_OUTPUT"
          printf 'previous_latest=%s\n' "$PREVIOUS_LATEST" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';
        const tags = JSON.parse(readFileSync(process.env.PACKAGE_TAGS_PATH, 'utf8'));
        if (tags.next !== undefined && (typeof tags.next !== 'string' || !/^[a-zA-Z0-9.+-]+$/.test(tags.next))) {
          throw new Error('invalid registry next tag');
        }
        appendFileSync(process.env.GITHUB_OUTPUT, `previous_next=${tags.next ?? ''}\n`);
        NODE
        elif grep -q 'E404' "$PACKAGE_TAGS_ERROR_PATH"; then
          printf 'had_previous_latest=false\n' >> "$GITHUB_OUTPUT"
          printf 'previous_latest=\n' >> "$GITHUB_OUTPUT"
          printf 'previous_next=\n' >> "$GITHUB_OUTPUT"
        else
          cat "$PACKAGE_TAGS_ERROR_PATH" >&2
          exit 1
        fi

        if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" --json > "$VERSION_METADATA_PATH" 2> "$VERSION_METADATA_ERROR_PATH"; then
          node --input-type=module <<'NODE'
        import { readFileSync } from 'node:fs';

        const metadata = JSON.parse(readFileSync(process.env.VERSION_METADATA_PATH, 'utf8'));
        if (metadata.version !== process.env.PACKAGE_VERSION) {
          throw new Error(`registry version mismatch: ${metadata.version}`);
        }
        if (metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY) {
          throw new Error(`registry integrity mismatch: ${metadata.dist?.integrity}`);
        }
        NODE
          printf 'already_published=true\n' >> "$GITHUB_OUTPUT"
        elif grep -q 'E404' "$VERSION_METADATA_ERROR_PATH"; then
          printf 'already_published=false\n' >> "$GITHUB_OUTPUT"
        else
          cat "$VERSION_METADATA_ERROR_PATH" >&2
          exit 1
        fi

    - name: Publish prerelease to next
      if: steps.registry.outputs.already_published != 'true'
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        PACKAGE_TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.filename }}
      run: npm publish "$PACKAGE_TARBALL" --tag next --provenance --access public

    - name: Inspect published registry state
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.pack.outputs.name }}
        PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        HAD_PREVIOUS_LATEST: ${{ steps.registry.outputs.had_previous_latest }}
        PREVIOUS_LATEST: ${{ steps.registry.outputs.previous_latest }}
        PREVIOUS_NEXT: ${{ steps.registry.outputs.previous_next }}
        ALREADY_PUBLISHED: ${{ steps.registry.outputs.already_published }}
        RETAINED_ARTIFACT: ${{ inputs.retained-artifact }}
        REGISTRY_JSON_PATH: ${{ runner.temp }}/prerelease-published-version.json
        DIST_TAGS_JSON_PATH: ${{ runner.temp }}/prerelease-published-tags.json
      run: |
        set -euo pipefail
        # npm can accept an upload before registry processing makes it readable.
        # Keep every identity/tag check intact and allow a bounded five minutes.
        for attempt in $(seq 1 60); do
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" --json > "$REGISTRY_JSON_PATH" 2>/dev/null &&
            npm view "$PACKAGE_NAME" dist-tags --json > "$DIST_TAGS_JSON_PATH" 2>/dev/null; then
            if node --input-type=module <<'NODE'
        import { readFileSync } from 'node:fs';

        const metadata = JSON.parse(readFileSync(process.env.REGISTRY_JSON_PATH, 'utf8'));
        const distTags = JSON.parse(readFileSync(process.env.DIST_TAGS_JSON_PATH, 'utf8'));
        if (metadata.version !== process.env.PACKAGE_VERSION) {
          throw new Error(`registry version mismatch: ${metadata.version}`);
        }
        if (metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY) {
          throw new Error(`registry integrity mismatch: ${metadata.dist?.integrity}`);
        }
        const expectedNext = process.env.RETAINED_ARTIFACT && process.env.ALREADY_PUBLISHED === 'true'
          ? (process.env.PREVIOUS_NEXT || undefined) : process.env.PACKAGE_VERSION;
        if (distTags.next !== expectedNext) {
          throw new Error(`registry next tag mismatch: ${distTags.next}`);
        }

        if (process.env.HAD_PREVIOUS_LATEST === 'true') {
          if (distTags.latest !== process.env.PREVIOUS_LATEST) {
            throw new Error(`registry latest tag mismatch: ${distTags.latest}`);
          }
        } else if (
          distTags.latest !== undefined &&
          distTags.latest !== process.env.PACKAGE_VERSION
        ) {
          throw new Error(`unexpected registry latest tag: ${distTags.latest}`);
        } else if (!process.env.PACKAGE_VERSION.includes('-')) {
          throw new Error(`stable publication is not authorized: ${process.env.PACKAGE_VERSION}`);
        }
        NODE
            then
              exit 0
            fi
          fi
          if [[ "$attempt" -lt 60 ]]; then
            sleep 5
          fi
        done
        echo "registry inspection failed for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
        exit 1

    - name: Preserve existing next after retained upload
      if: steps.registry.outputs.already_published != 'true' && inputs.retained-artifact != ''
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
        PACKAGE_NAME: ${{ steps.pack.outputs.name }}
        PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        PREVIOUS_NEXT: ${{ steps.registry.outputs.previous_next }}
        DIST_TAGS_JSON_PATH: ${{ runner.temp }}/prerelease-restore-tags.json
      run: |
        set -euo pipefail
        # A prerequisite is not the current release. Preserve an existing next;
        # when no next existed, retain the original first-publication behavior.
        if [[ -n "$PREVIOUS_NEXT" && "$PREVIOUS_NEXT" != "$PACKAGE_VERSION" ]]; then
          npm view "$PACKAGE_NAME" dist-tags --json > "$DIST_TAGS_JSON_PATH"
          CURRENT_NEXT=$(node --input-type=module <<'NODE'
        import { readFileSync } from 'node:fs';
        const tags = JSON.parse(readFileSync(process.env.DIST_TAGS_JSON_PATH, 'utf8'));
        if (tags.next !== process.env.PACKAGE_VERSION && tags.next !== process.env.PREVIOUS_NEXT) {
          throw new Error('registry next changed outside this retained upload');
        }
        console.log(tags.next);
        NODE
          )
          if [[ "$CURRENT_NEXT" == "$PACKAGE_VERSION" ]]; then
            npm dist-tag add "$PACKAGE_NAME@$PREVIOUS_NEXT" next
          fi
        fi

    - name: Verify final registry state
      shell: bash
      env:
        PACKAGE_NAME: ${{ steps.pack.outputs.name }}
        PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        EXPECTED_INTEGRITY: ${{ steps.pack.outputs.integrity }}
        HAD_PREVIOUS_LATEST: ${{ steps.registry.outputs.had_previous_latest }}
        PREVIOUS_LATEST: ${{ steps.registry.outputs.previous_latest }}
        PREVIOUS_NEXT: ${{ steps.registry.outputs.previous_next }}
        ALREADY_PUBLISHED: ${{ steps.registry.outputs.already_published }}
        RETAINED_ARTIFACT: ${{ inputs.retained-artifact }}
        REGISTRY_JSON_PATH: ${{ runner.temp }}/prerelease-final-version.json
        DIST_TAGS_JSON_PATH: ${{ runner.temp }}/prerelease-final-tags.json
      run: |
        set -euo pipefail
        for attempt in $(seq 1 60); do
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" --json > "$REGISTRY_JSON_PATH" 2>/dev/null &&
            npm view "$PACKAGE_NAME" dist-tags --json > "$DIST_TAGS_JSON_PATH" 2>/dev/null; then
            if node --input-type=module <<'NODE'
        import { readFileSync } from 'node:fs';

        const metadata = JSON.parse(readFileSync(process.env.REGISTRY_JSON_PATH, 'utf8'));
        const distTags = JSON.parse(readFileSync(process.env.DIST_TAGS_JSON_PATH, 'utf8'));
        if (metadata.version !== process.env.PACKAGE_VERSION) {
          throw new Error(`registry version mismatch: ${metadata.version}`);
        }
        if (metadata.dist?.integrity !== process.env.EXPECTED_INTEGRITY) {
          throw new Error(`registry integrity mismatch: ${metadata.dist?.integrity}`);
        }
        const preserveNext = process.env.RETAINED_ARTIFACT &&
          (process.env.ALREADY_PUBLISHED === 'true' || process.env.PREVIOUS_NEXT);
        const expectedNext = preserveNext ? (process.env.PREVIOUS_NEXT || undefined) : process.env.PACKAGE_VERSION;
        if (distTags.next !== expectedNext) {
          throw new Error(`registry next tag mismatch: ${distTags.next}`);
        }
        if (process.env.HAD_PREVIOUS_LATEST === 'true') {
          if (distTags.latest !== process.env.PREVIOUS_LATEST) {
            throw new Error(`registry latest tag mismatch: ${distTags.latest}`);
          }
        } else if (
          distTags.latest !== undefined &&
          distTags.latest !== process.env.PACKAGE_VERSION
        ) {
          throw new Error(`unexpected registry latest tag: ${distTags.latest}`);
        } else if (!process.env.PACKAGE_VERSION.includes('-')) {
          throw new Error(`stable publication is not authorized: ${process.env.PACKAGE_VERSION}`);
        }
        NODE
            then
              exit 0
            fi
          fi
          if [[ "$attempt" -lt 60 ]]; then
            sleep 5
          fi
        done
        echo "registry verification failed for $PACKAGE_NAME@$PACKAGE_VERSION" >&2
        exit 1
