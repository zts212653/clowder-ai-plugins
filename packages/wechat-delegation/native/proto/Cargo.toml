[package]
name = "clowder-wechat-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
license = "MIT"
publish = false
description = "Source-pinned text-only protocol subset for the Clowder WeChat connection service"

[lib]
name = "wechat_protocol"

[dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
openssl = { version = "=0.10.81", features = ["vendored"] }
flate2 = "=1.1.10"
base64 = "=0.22.1"
hex = "=0.4.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking"] }
zeroize = { version = "=1.9.1", features = ["derive"] }
