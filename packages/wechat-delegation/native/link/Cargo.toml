[package]
name = "clowder-wechat-link"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"
license = "MIT"
publish = false

[dependencies]
wechat-protocol = { package = "clowder-wechat-protocol", path = "../proto" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
zeroize = "=1.9.1"
openssl = { version = "=0.10.81", features = ["vendored"] }
anyhow = "=1.0.104"

[build-dependencies]
cc = "=1.9.0"
