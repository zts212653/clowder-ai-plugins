pluginId: official.weixin-mp
version: 0.1.0-alpha.7
contractVersion: 0.1.0
name: WeChat Official Account
description:
  default: Prepare, upload, publish, and inspect WeChat Official Account content.
  translations:
    zh-CN: 准备、上传、发布并查看微信公众号内容。
icon:
  type: svg
  src: assets/icon.svg
steps:
  - text: 在微信公众平台注册/登录，获取 App ID 和 App Secret
  - text: 目前支持已认证的服务号，订阅号不支持部分接口
configuration:
  - key: appId
    label: App ID
    kind: string
    required: true
  - key: appSecret
    label: App Secret
    kind: secret
    required: true
contributions:
  - type: limb
    id: weixin-mp-limb
    manifestPath: limbs/weixin-mp.yml
  - type: skill
    id: weixin-mp-skill
    path: skills/weixin-mp
test:
  action:
    method: weixin-mp:test_connection
features:
  - id: publish-official-account-content
    name: Publish WeChat Official Account content
    resources: []
    contributions:
      - type: limb
        id: weixin-mp-limb
      - type: skill
        id: weixin-mp-skill
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
