pluginId: official.companion.personal-chrome
version: 0.1.0-alpha.11
contractVersion: 0.1.0
name: Personal Chrome Companion
icon:
  type: svg
  src: assets/icon.svg
description:
  default: Host authorized ChatGPT conversations through the F247 personal Chrome extension and native messaging helper.
  translations:
    zh-CN: 通过 F247 个人 Chrome 扩展与原生消息助手托管已授权的 ChatGPT 会话。
configuration:
  - key: personalChromeAuthorizations
    label: ChatGPT conversation authorizations
    description: Authorizations binding exact https://chatgpt.com/c/<id> conversations to the cloud cat.
    kind: operation
    required: false
    actions:
      - id: list
        label: Authorized conversations
        render: status
        resultRender: rows
        action:
          method: personal-chrome-host.authorizations.list
      - id: revoke
        label: Revoke authorization
        render: row
        confirm: Revoke this ChatGPT conversation authorization? The cloud cat will no longer be able to send messages to it.
        action:
          method: personal-chrome-host.authorizations.revoke
        next: list
      - id: refresh-titles
        label: Refresh titles
        render: button
        action:
          method: personal-chrome-host.authorizations.refresh-titles
        next: list
      - id: check-page
        label: 检查会话页面
        render: row
        resultRender: status
        action:
          method: personal-chrome-host.check-conversation
      - id: status
        label: Authorization status
        render: status
        action:
          method: personal-chrome-host.authorizations.status
test:
  action:
    method: personal-chrome-host.test
contributions:
  - type: webhook
    id: personal-chrome-console-recovery
    path: personal-chrome/recovery
    methods: [ POST ]
    action: { method: personal-chrome-host.console.http }
  - type: webhook
    id: personal-chrome-console-pick
    path: personal-chrome/pick
    methods: [ POST ]
    action: { method: personal-chrome-host.console.http }
  - type: webhook
    id: personal-chrome-console-refresh
    path: personal-chrome/refresh
    methods: [ POST ]
    action: { method: personal-chrome-host.console.http }
  - type: webhook
    id: personal-chrome-console-refresh-titles
    path: personal-chrome/refresh-titles
    methods: [ POST ]
    action: { method: personal-chrome-host.console.http }
  - type: cloud-conversation-host
    id: personal-chrome-chatgpt-host
    provider: chatgpt
    appendMessage:
      method: personal-chrome-host.append-message
    assistantReturns:
      list:
        method: personal-chrome-host.assistant-returns.list
      ack:
        method: personal-chrome-host.assistant-returns.ack
features:
  - id: personal-chrome-host
    name: Personal Chrome conversation host
    resources: []
    contributions:
      - { type: webhook, id: personal-chrome-console-recovery }
      - { type: webhook, id: personal-chrome-console-pick }
      - { type: webhook, id: personal-chrome-console-refresh }
      - { type: webhook, id: personal-chrome-console-refresh-titles }
      - type: cloud-conversation-host
        id: personal-chrome-chatgpt-host
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
  dataDirectory: personal-chrome-host
pdl:
  ns: personalChrome
  templates:
    - slot: chat.rich
      id: cloudRecovery
      keys:
        - cloudRecovery.chatgpt
      node:
        blocks:
          - type: box
            load: $.load
            error: t:personalChrome.readError
            retry:
              act: plugin
              args:
                request: refresh
              disabled: $.pending
            blocks:
              - type: kv
                when: $.card.only
                from:
                  - k: t:chatCards.field.conversation
                    v:
                      t: chat.cloudConversation
                      args:
                        - $.card.only.displayTitle
              - type: select
                id: $.card.selectId
                value: $.card.value
                options:
                  - v: ""
                    label: t:runtime.chooseConversation
                  - from: $.card.candidates
                    item:
                      v: "@chatUrl"
                      label:
                        t: chat.cloudConversation
                        args:
                          - "@displayTitle"
                label: t:runtime.chooseConversation
                change: plugin
                when: $.card.canChoose
                args:
                  request: pick
                  key: $.card.key
                disabled: $.pending
              - type: notice
                tone: warn
                text:
                  t: personalChrome.issue
                  args:
                    - $.card.connectionIssue
                when: $.card.connectionIssue
                action:
                  type: button
                  label: t:personalChrome.settings
                  act: open
                  args: $.card.settings
              - type: notice
                text:
                  t: personalChrome.issue
                  args:
                    - $.card.titleSync.kind
                    - $.card.titleSync.n
                when: $.card.titleSync
              - type: status
                text: t:common.status.connected
                when: $.card.bound
              - type: toolbar
                items:
                  - type: button
                    primary: true
                    label: t:home.reconnect
                    act: bindRetry
                    args: $.card.submit
                    when:
                      - $.card.canSubmit
                      - $.card.bindOnly
                    disabled: $.pending
                  - type: button
                    primary: true
                    label: t:runtime.bindRetry
                    act: bindRetry
                    args: $.card.submit
                    when:
                      - $.card.canSubmit
                      - "!$.card.bindOnly"
                    disabled: $.pending
                  - type: button
                    label: t:personalChrome.refreshTitles
                    act: plugin
                    when: "!$.card.bound"
                    args:
                      request: refreshTitles
                    disabled: $.pending
        sources:
          card: recovery
  requests:
    recovery:
      path: personal-chrome/recovery
      method: POST
      body:
        key: "@key"
        boundChatUrl: "@boundChatUrl"
        bindOnly: "@bindOnly"
        canSubmit: "@canSubmit"
        args: "@args"
    pick:
      path: personal-chrome/pick
      method: POST
      body:
        key: "@key"
        value: "@v"
    refreshTitles:
      path: personal-chrome/refresh-titles
      method: POST
      body: {}
    refresh:
      path: personal-chrome/refresh
      method: POST
      body: {}
