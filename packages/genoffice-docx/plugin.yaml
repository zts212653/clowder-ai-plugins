pluginId: dev.clowder.genoffice-docx
version: 0.1.0-alpha.4
contractVersion: 0.1.0
name: GenOffice
icon:
  type: svg
  src: assets/icon.svg
description:
  default: Edit DOCX together and preview PDF in your Clowder workspace. Requires
    a compatible Host.
  translations:
    zh-CN: 在 Clowder 工作空间共同编辑 DOCX，只读预览 PDF。需要兼容的宿主。
contributions:
  - type: content-editor-provider
    id: genoffice-docx
    mediaTypes:
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    surface:
      entrypoint: renderer/index.html
      integrity: sha256-mfusjkRv8pE4EOPOZxGtfpc6E3b0DD2+suZ0CUgLKXc=
      sandbox: dedicated-origin-iframe
      navigationPolicy: navigation-api-deny
    bridgeVersion: 1.0.0
    operations:
      - load
      - settle
      - comment
      - tracked-change
    semanticMaterializer:
      executionClass: dedicated-browser-worker
      entrypoint: renderer/semantic-worker.js
      integrity: sha256-BKMyn3bqKZebqZRYAiYErHWOpjOO6UN74Ft+UJkhHcI=
      protocolVersion: 1.0.0
  - type: content-preview-provider
    id: genoffice-preview
    formats:
      - extension: pdf
        mediaType: application/pdf
    surface:
      entrypoint: renderer/preview/index.html
      integrity: sha256-OCTOufj5g6Zo+I9zxlSwqh4bcHvH3yyOClYWQdvETtA=
      sandbox: dedicated-origin-iframe
      navigationPolicy: navigation-api-deny
    bridgeVersion: 1.0.0
features:
  - id: edit-docx
    name: Edit DOCX
    resources: []
    contributions:
      - type: content-editor-provider
        id: genoffice-docx
  - id: preview-office
    name: Preview PDF
    resources: []
    contributions:
      - type: content-preview-provider
        id: genoffice-preview
runtime:
  transport: builtin
