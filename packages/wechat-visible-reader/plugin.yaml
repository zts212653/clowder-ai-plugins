pluginId: official.wechat-visible-reader
version: 0.1.0-alpha.1
contractVersion: 0.1.0
name: WeChat Visible Reader
description:
  default: Read visible Mac WeChat messages under explicit, short-lived local authorization.
  translations:
    zh-CN: 在明确、短时的本机授权下读取 Mac 微信可见消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: visibleReadingAuthorization
    label: Visible WeChat reading authorization
    description: Local owner authorization for a bounded read of the current WeChat conversation.
    kind: operation
    required: false
    actions:
      - id: arm
        label: Authorize for 10 minutes
        render: button
        action:
          method: wechat-visible-reader:arm
          params:
            minutes: 10
        next: disarm
      - id: disarm
        label: Revoke authorization
        render: button
        action:
          method: wechat-visible-reader:disarm
        next: arm
      - id: status
        label: Authorization status
        render: status
        action:
          method: wechat-visible-reader:status
contributions:
  - type: limb
    id: wechat-visible-reader-limb
    manifestPath: limbs/wechat-visible-reader.yml
features:
  - id: read-visible-wechat
    name: Read visible WeChat messages
    resources: []
    contributions:
      - type: limb
        id: wechat-visible-reader-limb
    capabilities:
      - plugin.state.get
      - plugin.state.set
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
