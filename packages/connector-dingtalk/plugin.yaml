pluginId: official.connector.dingtalk
version: 0.1.0-alpha.8
contractVersion: 0.1.0
name: DingTalk Connector
description:
  default: Receive and send DingTalk enterprise messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送钉钉企业消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: appKey
    label: App Key
    kind: string
    required: true
  - key: appSecret
    label: App Secret
    kind: secret
    required: true
permissions:
  label: 钉钉
steps:
  - text: 在钉钉开放平台创建企业内部应用，获取 App Key 和 App Secret
  - text: 在「机器人与消息推送」中开启机器人能力
contributions:
  - type: identity
    id: dingtalk-bot
    displayName: DingTalk bot
  - type: message-subscription
    id: dingtalk
    binding: dingtalk-bot
    action:
      method: dingtalk.outbound
    presentation: v1
  - type: media-source
    id: dingtalk-media
    binding: dingtalk-bot
features:
  - id: dingtalk-messaging
    name: DingTalk messaging
    resources: []
    contributions:
      - type: identity
        id: dingtalk-bot
      - type: message-subscription
        id: dingtalk
      - type: media-source
        id: dingtalk-media
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
