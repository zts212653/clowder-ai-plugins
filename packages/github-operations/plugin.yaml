runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
pdl:
  ns: github
  icon: mark
  icons:
    mark: <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/>
  inserts:
    - id: github.community
      anchor: panel.tools
      at: inside
      node:
        title: t:github.plugin.entries.community
        icon: msg
        open:
          node: github.community
        tool: true
    - id: github.commit
      anchor: ws.git.commit
      at: inside
      node:
        title: t:github.plugin.entries.commit
        icon: mark
        open:
          action: ghOpenCommit
        args:
          k: short
        scope: row
        move: ws.git.commit
    - id: github.issue
      anchor: chat.thread.more
      at: inside
      priority: 10
      node:
        title: t:github.plugin.entries.issue
        icon: mark
        open:
          action: ghIssue
        scope: page
        move: chat.thread.more
  templates:
    - slot: chat.tool.result
      id: prcard
      match:
        tool: gh pr view
      priority: 10
      icon: mark
      by: GitHub 插件
      extract:
        pr:
          from: tool
          re: pr view (\d+)
        state:
          from: json
          key: state
        draft:
          from: json
          key: isDraft
          map:
            "true": Draft
            "false": ""
        merge:
          from: json
          key: mergeCommit
          empty: 未合入
      title: "PR #{pr}"
      chips:
        - "{state}"
        - "{draft}"
      line: mergeCommit：{merge}
    - slot: chat.rich
      id: issueDraft
      keys:
        - card.community_issue_draft
        - card.community_issue_preview
      node:
        vm: githubIssueDraft
        blocks:
          - type: box
            variant: card
            blocks:
              - type: text
                variant: title
                text: $.title
              - type: settings
                when: $.canEdit
                rows:
                  - label: t:github.chatCards.field.repo
                    when: "!$.draftId"
                    ctls:
                      - type: select
                        id: $.repoId
                        value: $.targetRepo
                        options:
                          - from: $.repos
                            item:
                              v: "@"
                              label: "@"
                        change: cafeSel
                        label: t:github.chatCards.field.repo
                  - label: t:github.issueDraft.title
                    ctls:
                      - type: input
                        id: $.titleId
                        value: $.titleValue
                        input: cafeField
                        label: t:github.issueDraft.title
                  - label: t:github.issueDraft.body
                    ctls:
                      - type: input
                        id: $.bodyId
                        value: $.bodyMarkdown
                        rows: 8
                        input: cafeField
                        label: t:github.issueDraft.body
              - type: kv
                from:
                  - k: draftId
                    v: $.draftId
                  - k: t:github.chatCards.field.repo
                    v: $.targetRepo
                when: $.draftId
              - type: status
                text:
                  of: $.state
                  map:
                    loading: t:common.loading
                    published: t:github.issueDraft.published
                    cancelled: t:common.status.cancelled
                    draft: t:common.status.draft
                    _: ""
                when: $.state
              - type: notice
                tone: warn
                text: $.error
                when: $.error
                action:
                  type: button
                  label: t:common.retry
                  act: ghIssueDraftRetry
                  args: $.args
              - type: toolbar
                items:
                  - type: button
                    label: t:common.open
                    act: openUrl
                    args:
                      url: $.url
                    when: $.url
                  - type: grow
                  - type: button
                    label: t:common.cancel
                    act: ghIssueDraftCancel
                    args: $.args
                    when: $.canCancel
                  - type: button
                    primary: true
                    label: t:github.issueDraft.create
                    act: ghIssueDraftCreate
                    args: $.args
                    when: $.canCreate
                  - type: button
                    primary: true
                    label: t:github.issueDraft.publish
                    act: ghIssueDraftPublish
                    args: $.args
                    when: $.canPublish
  views:
    github.community:
      loading: t:github.wsCommunity.load.loading
      error: t:github.wsCommunity.load.error
      empty: t:github.wsCommunity.load.text
      vm: githubCommunity
      blocks:
        - type: head
          variant: detail
          when: $.detail.gone
          title: t:github.wsCommunity.detail.title
        - type: head
          variant: detail
          when: $.detail.n
          eyebrow:
            - parts:
                - parts:
                    - "#"
                    - $.detail.n
                  sep: ""
              mono: true
            - parts:
                - parts:
                    - " · "
                    - of: $.detail.state
                      map:
                        pending_decision: t:github.wsCommunity.pendingDecision
                        unreplied: t:github.wsCommunity.unreplied
                        discussing: t:github.wsCommunity.discussing
                        accepted: t:github.memoryOwners.stateNote.materialized
                        rejected: t:github.memoryOwners.stateNote.rejected
                        closed: t:github.wsCommunity.closed
                        _: $.detail.state
                    - " · "
                    - of: $.detail.ago
                      fmt: ago
                  sep: ""
          title: $.detail.title
          sub:
            parts:
              - of: $.detail.hasCat
                map:
                  "true":
                    parts:
                      - of:
                          - 0
                          - 1
                          - 2
                        item:
                          of: "@"
                          map:
                            "0": $.detail.catName
                            "1": " "
                            "2": $.detail.catHandle
                        sep: ""
                      - " → "
                      - $.detail.threadTitle
                    sep: ""
                  "false": —
                  _: $.detail.hasCat
          actions:
            - type: button
              label: t:github.wsCommunity.openThread
              act: goThread
              args:
                id: $.detail.thread
              when: $.detail.thread
            - type: button
              label: t:github.work.openGithub
              act: openUrl
        - type: section
          when: $.detail.dir
          title: t:github.wsCommunity.directionCard
          help: t:github.wsCommunity.directionHelp
          blocks:
            - type: settings
              from: $.detail.dir.questions
              row:
                label: "@label"
                control:
                  type: text
                  text: "@value"
              rows:
                - label: t:github.wsCommunity.evidence
                  control:
                    type: text
                    parts:
                      - parts: $.detail.dir.evidence
                        sep: 、
                        each:
                          text: "@"
                - label: t:github.wsCommunity.detail.recommendedRoute
                  control:
                    type: text
                    text:
                      of: $.detail.dir.route
                      map:
                        decline:
                          t: github.common.reject
                          args:
                            - $.detail.threadTitle
                        new:
                          t: github.workbench.route.new
                          args:
                            - $.detail.threadTitle
                        existing:
                          t: github.workbench.route.thread
                          args:
                            - $.detail.threadTitle
                        continue:
                          t: github.workbench.route.thread
                          args:
                            - $.detail.threadTitle
                        thread:
                          t: github.workbench.route.thread
                          args:
                            - $.detail.threadTitle
                        _: $.detail.dir.route
                - kind: field
                  label: t:github.wsCommunity.detail.role
                  id: ws-role
                  control:
                    type: select
                    id: ws-role
                    options:
                      - t:github.wsCommunity.detail.maintainer
                      - t:github.wsCommunity.detail.reviewer
                      - t:github.wsCommunity.detail.observer
                    value: $.detail.dir.role
            - type: toolbar
              items:
                - type: button
                  primary: $.detail.dir.accept
                  label: t:github.common.accept
                  act: setStatus
                  args:
                    entity: issue
                    id: $.detail.n
                    v: accepted
                - type: button
                  primary: $.detail.dir.reject
                  label: t:github.common.reject
                  act: setStatus
                  args:
                    entity: issue
                    id: $.detail.n
                    v: rejected
        - type: section
          when: $.detail.closure
          title: t:github.wsCommunity.preCloseCheck
          blocks:
            - type: list
              from: $.detail.closure.rows
              row: community.closure
            - type: toolbar
              items:
                - type: button
                  label: t:github.wsCommunity.markReplied
                  act: wsReport
                  args:
                    n: $.detail.n
                  when: $.detail.closure.pending
                - type: button
                  label: t:github.wsCommunity.exemptClose
                  act: wsWaive
                  args:
                    n: $.detail.n
                  when: $.detail.closure.pending
                - type: button
                  primary: true
                  label: t:github.wsCommunity.closeIssue
                  act: setStatus
                  args:
                    entity: issue
                    id: $.detail.n
                    v: closed
                  disabled: $.detail.closure.locked
        - type: toolbar
          when: $.repos
          note: "1"
          items:
            - type: input
              id: ws-repo
              mono: true
              list: ws-repos
              listFrom: $.repos
              value: $.list.repo
              placeholder: owner/repo
              label: t:github.chatCards.field.repo
              go: wsRepoSync
              icon: refresh
              goLabel: t:github.wsCommunity.sync
        - type: empty
          when: $.noRepo
          text: t:github.wsCommunity.syncHelp
        - type: text
          variant: meta
          when: $.list
          text:
            t: github.workbench.communitySummary
            args:
              - $.list.syncing
              - $.list.issueCount
              - $.list.prCount
        - type: toolbar
          when: $.list
          items:
            - type: select
              id: ws-c-st
              options:
                - v: all
                  label: t:github.wsCommunity.allStates
                - v: unreplied
                  label: t:github.wsCommunity.unreplied
                - v: discussing
                  label: t:github.wsCommunity.discussing
                - v: pending_decision
                  label: t:github.wsCommunity.pendingDecision
                - v: accepted
                  label: t:github.memoryOwners.stateNote.materialized
                - v: rejected
                  label: t:github.memoryOwners.stateNote.rejected
                - v: closed
                  label: t:github.wsCommunity.closed
              value: $.list.fs
              change: wsCSt
              label: t:github.common.state
            - type: select
              id: ws-c-cat
              options:
                - v: all
                  label: t:github.wsCommunity.list.cats
                - from: $.list.cats
                  item:
                    v: "@v"
                    label:
                      t: github.workbench.identity
                      args:
                        - "@name"
                        - "@handle"
              value: $.list.fc
              change: wsCCat
              label: t:github.wsCommunity.ownerCat
            - type: seg
              value: $.list.ft
              act: set
              args:
                path: ws.cTime
              options:
                - v: all
                  label: t:github.memory.allTime
                - v: "7"
                  label: t:github.wsCommunity.within7d
                - v: "30"
                  label: t:github.wsCommunity.within30d
                - v: "90"
                  label: t:github.wsCommunity.within90d
        - type: section
          when: $.list
          title: Issue
          note: "3"
          keep: true
          blocks:
            - type: list
              groups: $.list.issueGroups
              group:
                title:
                  of: "@state"
                  map:
                    pending_decision: t:github.wsCommunity.pendingDecision
                    unreplied: t:github.wsCommunity.unreplied
                    discussing: t:github.wsCommunity.discussing
                    accepted: t:github.memoryOwners.stateNote.materialized
                    rejected: t:github.memoryOwners.stateNote.rejected
                    closed: t:github.wsCommunity.closed
                    _: "@state"
              row: community.issue
              empty: t:github.wsCommunity.list.empty
        - type: section
          when: $.list
          title: PR
          keep: true
          blocks:
            - type: list
              groups: $.list.prGroups
              group:
                title:
                  of: "@state"
                  map:
                    unreplied: t:github.workbench.prGroup.unreplied
                    replied: t:github.workbench.prGroup.replied
                    new: t:github.frame.newActivity
                    merged: t:github.workbench.prGroup.merged
                    closed: t:github.wsCommunity.closed
                    _: "@state"
              row: community.pr
              empty: t:github.wsCommunity.list.empty
        - type: section
          title: t:github.wsCommunity.reconcileFindings
          blocks:
            - type: list
              from: $.list.findings
              row: community.finding
              optional: true
      panel:
        - t:github.plugin.entries.community
        - msg
        - ""
        - other
        - t:github.plugin.panel.desc
      bridge:
        - theme
        - members.read
        - thread.open
        - task.dispatch
    dlg.github.report:
      title: t:github.wsCommunity.markReplied
      fields:
        - id: dlg-in
          label: t:github.wsCommunity.report.label
          mono: true
          placeholder: https://github.com/owner/repo/issues/N#issuecomment-…
          req: true
      ok: t:github.wsCommunity.submit
    dlg.github.waive:
      title: t:github.wsCommunity.exemptClose
      fields:
        - id: dlg-r
          label: t:github.wsCommunity.reason
          placeholder: t:github.wsCommunity.reason
          req: true
        - id: dlg-e
          label: t:github.wsCommunity.evidence
          placeholder: t:github.wsCommunity.waiver.evidencePlaceholder
          req: true
      ok: t:github.wsCommunity.submit
  rows:
    community.issue:
      layout: two
      lead:
        - glyph: info
      title:
        - parts:
            - parts:
                - "#"
                - "@n"
              sep: ""
              tone: muted
          mono: true
        - text: "@title"
      sub:
        parts:
          - parts:
              - of: "@hasCat"
                map:
                  "true":
                    parts:
                      - "@catName"
                      - " → "
                      - "@threadTitle"
                    sep: ""
                  "false": —
                  _: "@hasCat"
          - text: " · "
          - text:
              of: "@ago"
              fmt: ago
        sep: ""
      cols:
        - w: auto
          v:
            parts:
              - control:
                  type: button
                  label: t:github.wsCommunity.issue.menu.label
                  act: wsSendSys
                  args:
                    n: "@n"
                  when: "@unreplied"
              - control:
                  type: status
                  text:
                    t: github.wsCommunity.priority
                    args:
                      - "@priority"
                  tone:
                    of: "@priority"
                    map:
                      urgent: danger
                      high: warn
                      normal: ""
                      _: "@priority"
                  when:
                    - "!@unreplied"
                    - "@drill"
                    - "!@normalPriority"
            sep: ""
        - control: []
      act:
        of: "@canOpen"
        map:
          "true":
            of: "@drill"
            map:
              "true": wsSub
              "false": goThread
              _: wsSub
          "false": ""
          _: "@canOpen"
      args:
        k: github.community
        v:
          t: github.workbench.issueSubKey
          args:
            - "@n"
        id: "@thread"
      tone:
        of: "@canOpen"
        map:
          "true": ""
          "false": past
          _: "@canOpen"
    community.pr:
      layout: two
      title:
        - parts:
            - parts:
                - "#"
                - "@n"
              sep: ""
              tone: muted
          mono: true
        - text: "@title"
      sub:
        parts:
          - "@author"
          - "@catName"
          - of: "@ago"
            fmt: ago
        sep: " · "
      meta:
        parts:
          - text: "@life"
          - text: "@cloud"
            tone:
              of: "@cloudFail"
              map:
                "true": danger
                "false": ""
                _: "@cloudFail"
          - text:
              t: github.workbench.prCI
              args:
                - "@ci"
            tone:
              of: "@ciFail"
              map:
                "true": danger
                "false": ""
                _: "@ciFail"
            when: "@ci"
          - parts:
              - text: t:github.wsCommunity.delivery.text
                when: "@sent"
              - text: "@sent"
                mono: true
                when: "@sent"
            sep: ""
            when: "@sent"
        sep: " · "
      act: goThread
      args:
        id: "@thread"
      cols:
        - v: []
          w: auto
        - control: []
    community.finding:
      layout: two
      title: "@msg"
      sub:
        text:
          t: github.wsCommunity.list.sub
          args:
            - "@kind"
            - "@sev"
            - of: "@st"
              map:
                pending: t:github.films.opinionState.open
                confirmed: t:github.memoryOwners.stateNote.replayed
                resolved: t:github.wsCommunity.resolved
                exempted: t:github.wsCommunity.exempted
                _: "@st"
      cols:
        - w: auto
          control:
            - type: button
              label: t:github.common.confirm
              act: setStatus
              args:
                entity: finding
                id: "@i"
                v: confirmed
              when: "@pending"
            - type: button
              label: t:github.wsCommunity.resolved
              act: setStatus
              args:
                entity: finding
                id: "@i"
                v: resolved
              when: "@pending"
            - type: button
              label: t:github.wsCommunity.exempt
              act: setStatus
              args:
                entity: finding
                id: "@i"
                v: exempted
              when: "@pending"
        - control: []
    community.closure:
      layout: two
      title:
        - text: t:github.wsCommunity.exempted
          when: "@waived"
        - text: "@text"
          when: "@blocker"
        - text: t:github.wsCommunity.detail.checksPassed
          when: "@ready"
      sub:
        - text: "@text"
          when: "@waived"
      cols:
        - w: auto
          control:
            - type: status
              tone: warn
              text: t:github.wsCommunity.detail.text
              when: "@blocker"
            - type: status
              text: t:github.wsCommunity.detail.ready
              when: "@ready"
        - control: []
