<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宪宪 · 桌边陪伴</title><link rel="stylesheet" href="./spike.css"></head>
<body>
  <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2.6 7.4M3 4v7h7M12 7v5l3 2"/></symbol>
    <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1v14"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></symbol>
    <symbol id="i-end" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/></symbol>
  </svg>
  <header class="lab">
    <div><strong>桌边陪伴</strong><span>交互 spike · 语音与共享为模拟，不调用模型、不采集媒体</span></div>
    <nav aria-label="预览情境"><button id="theme">深色背景</button><label><input id="fail" type="checkbox">模拟连接失败</label><button id="restore">叫回宪宪</button><button id="instructions">操作提示</button></nav>
    <p id="help" hidden>点猫找他聊聊，右键看其他操作，按住可移动。点空白或 Esc 收起；语音／共享小标记可以直接停止。</p>
  </header>
  <main id="desktop" aria-label="桌面体验区">
    <div class="desk-context" aria-hidden="true"><p>继续做你的事。</p><span>宪宪就在旁边。</span></div>
    <div id="anchor">
      <button id="pet" aria-label="宪宪：点击交流，右键更多，拖动移动" aria-expanded="false" aria-controls="actions menu chat"></button>
      <div id="indicators">
        <button id="call-badge" hidden aria-label="结束语音" title="结束语音"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg></button>
        <button id="share-badge" hidden aria-label="停止共享" title="停止共享"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
      </div>
    </div>
    <section id="actions" class="floating" aria-label="找宪宪" hidden>
      <p id="connection-error" role="status" hidden>暂时没连上。可以重试，也可以写下来。</p>
      <div class="action-row">
        <button id="begin" class="primary" data-action="begin"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg><span class="label">语音聊</span></button>
        <button data-action="write"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span>打字</span></button>
        <button id="mute" data-action="mute" hidden><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg><span class="label">静音</span></button>
      </div>
      <div id="active-actions" class="action-row" hidden>
        <button data-action="share" id="share"><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg><span class="label">共享画面</span></button>
        <button data-action="stop"><svg class="icon" aria-hidden="true"><use href="#i-end"/></svg><span>结束通话</span></button>
      </div>
    </section>
    <section id="menu" class="floating" aria-label="宪宪的菜单" hidden>
      <strong class="menu-title">宪宪</strong>
      <button data-action="history"><svg class="icon" aria-hidden="true"><use href="#i-history"/></svg><span>聊天记录</span></button>
      <button data-action="write"><svg class="icon" aria-hidden="true"><use href="#i-keyboard"/></svg><span>打字</span></button>
      <div class="menu-divider" role="separator"></div>
      <button id="menu-share" data-action="share" title="语音连接后可共享画面"><svg class="icon" aria-hidden="true"><use href="#i-screen"/></svg><span class="label">共享画面</span></button>
      <button id="documents" data-action="documents" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg><span>资料查询</span><span class="menu-status">开启</span></button>
      <div class="menu-divider" role="separator"></div>
      <button data-action="hide" class="quiet-action"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span>收起宪宪</span></button>
    </section>
    <section id="chat" class="floating" aria-label="和宪宪写几句" hidden>
      <header><strong>和宪宪写几句</strong><button data-action="dismiss" aria-label="收起文字">收起</button></header>
      <div id="messages" role="log" aria-live="polite"><p class="empty">想说什么，就写在这里。</p></div>
      <form id="compose"><textarea id="draft" aria-label="给宪宪写一句" placeholder="写一句…" rows="2" maxlength="8000"></textarea><button type="submit" class="primary">发送</button></form>
      <small>仅保留在本次预览，未发送给猫；刷新会清空。</small>
    </section>
    <p id="announcement" class="sr-only" role="status"></p>
  </main>
  <script type="module" src="./spike.mjs"></script>
</body></html>
