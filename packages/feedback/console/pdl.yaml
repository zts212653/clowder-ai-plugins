ns: feedback
inserts:
  - id: feedback
    anchor: inbox
    at: before
    node:
      title: t:feedback.plugin.entry
      icon: msg
      open:
        node: feedback.panel
        as: float
popups:
  feedback:
    at: center
    focus: true
    exit:
      - x
      - esc
views:
  feedback.panel:
    type: frame
    html:
      request: panel
    popup: feedback
    title: t:feedback.plugin.entry
    loading: t:feedback.load.loading
    error: t:feedback.load.error
requests:
  panel:
    path: panel
