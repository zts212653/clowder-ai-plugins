pluginId: official.chatgpt-dot
version: 0.2.0-alpha.7
contractVersion: 0.3.1-candidate.0
name: ChatGPT Dot
description:
  default: 将已配对的 ChatGPT Dot 接入对话，回复与原图回到召唤来源。
  translations:
    en: Connect a paired ChatGPT Dot and return source-bound replies and original images.
icon:
  type: svg
  src: assets/chatgpt-cloud.svg
call:
  alias: dot
  displayName: Dot
steps:
  - text: 若 ChatGPT 已有本实例连接，不要新建或修改正式 Pro 连接；先由本实例主人恢复原共享入口。
  - text: 全新隔离验收时，由本实例主人提供 HTTPS Server URL；在 https://chatgpt.com/plugins 点 + → Add custom MCP server。仅当 URL 自带验收 token 时，Authentication 选 No authentication。
  - text: 本地确认连接范围后，在 ChatGPT 安装 personal plugin、Refresh 元数据，在 Work 对话用 @ 选择它，再按配对说明订阅 dot.summoned。
  - text: 发起往返测试；读取原消息并回复校验码后，再检查测试结果。
configuration:
  - key: webhookProxyUrl
    label: 回调代理（可选）
    kind: string
    required: false
    description: 仅支持本机 HTTP CONNECT 代理；留空直接连接。保存后更新连接。
  - key: connection
    label: Dot 连接
    kind: operation
    required: false
    actions:
      - id: status
        label: 查看连接状态
        render: status
        action: { method: dot.status }
      - id: begin
        label: 准备连接
        render: button
        resultRender: rows
        confirm: 确认准备新的配对说明，并查看接入现有猫咖云端连接的授权范围？
        action: { method: dot.begin }
      - id: reconnect
        label: 重新配对
        render: button
        confirm: 这会撤销旧配对，旧召唤将不能继续回复。
        action: { method: dot.reconnect }
      - id: disconnect
        label: 断开连接
        render: button
        confirm: 断开后无法接收召唤，已保存的消息和原图保留。
        action: { method: dot.disconnect }
      - id: roundtrip
        label: 发起往返测试
        render: button
        action: { method: dot.roundtrip }
      - id: bind-shared
        label: 连接现有猫咖云端连接
        render: row
        confirm: 确认将这个安装公开的工具与事件接入现有猫咖云端连接？
        next: begin
        action: { method: dot.bind-shared }
test:
  action: { method: dot.test }
contributions:
  - type: identity
    id: dot
    displayName: Dot
  - type: webhook
    id: dot-original
    path: images/:imageId
    methods: [GET]
  - type: media-source
    id: dot-images
    binding: dot
features:
  - id: dot-connection
    name: Dot 配对与对话
    resources: []
    contributions:
      - { type: identity, id: dot }
      - { type: webhook, id: dot-original }
      - { type: media-source, id: dot-images }
    capabilities:
      - plugin.config.read
      - plugin.state.get
      - plugin.state.set
      - messaging.send
      - message.event.subscribe
      - streams.read
      - thread.listMetadata
      - thread.readContent
      - thread.write
data:
  - { name: dot-connection, dataClass: relationship, strategy: retained, schemaVersion: '1' }
  - { name: dot-dispatch, dataClass: interaction-history, strategy: retained, schemaVersion: '1' }
  - { name: dot-images, dataClass: derived-user-visible, strategy: retained, schemaVersion: '1' }
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
