pluginId: official.chatgpt-dot
version: 0.2.0-alpha.53
contractVersion: 0.3.3-candidate.1
name: ChatGPT Dot
description:
  default: 将已配对的 ChatGPT Dot 接入对话，回复与原图回到召唤来源。
  translations:
    en: Connect a paired ChatGPT Dot and return source-bound replies and original images.
icon:
  type: svg
  src: assets/chatgpt-cloud.svg
call:
  alias: dot
  displayName: Dot
steps:
  - text: 选好入口类型，点「生成 Server URL」或「创建临时入口」，复制 Server URL。
  - text: 在 https://chatgpt.com/plugins 选「+」→「Add custom MCP server」，粘贴 Server URL，Authentication 选「No authentication」，记下插件名称。
  - text: 在插件详情确认有 Dot 工具和 dot.summoned 事件；没有时点 Refresh。
  - text: 点「生成订阅消息」并复制。在 ChatGPT 切到 Work，在目标对话里 @ 刚添加的插件，粘贴消息发送并允许订阅。
  - text: 回到「Dot 连接」。订阅建立后会自动验证往返，显示可用后就能在对话里 @dot。
configuration:
  - key: endpointMode
    label: ChatGPT 入口类型
    kind: select
    required: true
    default: temporary
    options:
      - { value: long-lived, label: 长期公网入口 }
      - { value: temporary, label: 临时公网入口 }
    description: 长期入口用你自己的公网地址；临时入口由 Dot 创建，最长 24 小时。
  - key: longLivedServerUrlTemplate
    label: 长期公网入口地址
    kind: string
    required: true
    description: 指向插件转发路径的 HTTPS 地址，含且只含一次 {token}，例如 https://host.example/api/plugins/official.chatgpt-dot/mcp?token={token}。
  - key: externalMcpToken
    label: 自定义访问密钥（可选）
    kind: secret
    required: false
    description: 留空自动生成。自定义时用 43–256 位字母、数字、_ 或 -，保存后再生成 Server URL；已撤销的不能再用。
  - key: temporaryEndpointHours
    label: 临时入口有效小时数
    kind: number
    required: false
    default: 1
    description: 最长 24 小时；到期、重启、停用或卸载时关闭。
  - key: longLivedEndpoint
    label: Server URL
    kind: operation
    required: false
    target: [longLivedServerUrlTemplate]
    actions:
      - id: use-long-lived
        label: 生成 Server URL
        render: button
        resultRender: text
        action: { method: dot.use-long-lived }
      - id: refresh-credential
        label: 轮换访问密钥
        render: button
        resultRender: text
        confirm: 轮换后 Server URL 会变，要在 ChatGPT 重新添加连接并发送订阅消息；新连接验证成功前旧连接保留。
        action: { method: dot.refresh-credential }
  - key: temporaryEndpoint
    label: Server URL
    kind: operation
    required: false
    actions:
      - id: start-temporary
        label: 创建临时入口
        render: button
        resultRender: text
        confirm: 会启动一个有时限的临时公网入口。
        action: { method: dot.start-temporary }
      - id: refresh-credential
        label: 轮换访问密钥
        render: button
        resultRender: text
        confirm: 轮换后 Server URL 会变，要在 ChatGPT 重新添加连接并发送订阅消息；新连接验证成功前旧连接保留。
        action: { method: dot.refresh-credential }
  - key: webhookProxyUrl
    label: 回调代理（可选）
    kind: string
    required: false
    description: 只支持本机 HTTP CONNECT 代理；留空直连。
  - key: subscription
    label: 订阅消息
    description: 发到目标 ChatGPT Work 对话：@ 刚添加的插件，粘贴后发送并允许订阅。
    kind: operation
    required: false
    actions:
      - id: show-instructions
        label: 生成订阅消息
        render: button
        resultRender: text
        action: { method: dot.show-instructions }
  - key: connection
    label: Dot 连接
    kind: operation
    required: false
    actions:
      - id: status
        label: 连接状态
        render: polling
        resultRender: rows
        action: { method: dot.status }
      - id: show-server-url
        label: 显示 Server URL
        render: row
        resultRender: text
        action: { method: dot.show-server-url }
      - id: repair-subscription
        label: 重新连接
        render: row
        resultRender: text
        next: status
        confirm: 会换一条新的订阅消息；Server URL 不变。
        action: { method: dot.repair-subscription }
      - id: cancel-pending
        label: 放弃本次更新
        render: row
        resultRender: rows
        confirm: 放弃待验证的新凭据，并关闭它的临时入口；现有凭据不变。
        action: { method: dot.cancel-pending }
      - id: begin-pairing
        label: 准备连接
        render: row
        resultRender: rows
        action: { method: dot.begin-pairing }
      - id: reconnect
        label: 重置连接
        render: row
        resultRender: rows
        confirm: 旧配对会撤销，旧召唤不能再回复。
        action: { method: dot.reconnect }
      - id: disconnect
        label: 断开连接
        render: row
        resultRender: rows
        confirm: 断开后收不到召唤；已保存的消息和原图保留。
        action: { method: dot.disconnect }
      - id: roundtrip
        label: 往返测试
        render: row
        resultRender: rows
        action: { method: dot.roundtrip }
      - id: retry-verification
        label: 重试验证
        render: row
        resultRender: rows
        action: { method: dot.retry-verification }
configurationVariants:
  discriminator: endpointMode
  branches:
    - id: long-lived
      when: { properties: { endpointMode: { const: long-lived } } }
      fields: [longLivedServerUrlTemplate, externalMcpToken, longLivedEndpoint]
    - id: temporary
      when: { properties: { endpointMode: { const: temporary } } }
      fields: [temporaryEndpointHours, temporaryEndpoint]
test:
  action: { method: dot.test }
contributions:
  - type: identity
    id: dot
    displayName: Dot
  - type: webhook
    id: dot-original
    path: images/:imageId
    methods: [GET]
  - type: media-source
    id: dot-images
    binding: dot
  - type: webhook
    id: dot-mcp-ingress
    path: mcp
    methods: [POST]
    verificationSecretRef: externalMcpToken
    requestBodyLimitBytes: 15728640
  - type: external-request
    id: dot-mcp
features:
  - id: dot-connection
    name: Dot 配对与对话
    resources: []
    contributions:
      - { type: identity, id: dot }
      - { type: webhook, id: dot-original }
      - { type: media-source, id: dot-images }
      - { type: webhook, id: dot-mcp-ingress }
      - { type: external-request, id: dot-mcp }
    capabilities:
      - plugin.config.read
      - plugin.state.get
      - plugin.state.set
      - messaging.send
      - message.event.subscribe
      - streams.read
      - thread.listMetadata
      - thread.readContent
      - thread.write
data:
  - { name: dot-connection, dataClass: relationship, strategy: retained, schemaVersion: '1' }
  - { name: dot-dispatch, dataClass: interaction-history, strategy: retained, schemaVersion: '1' }
  - { name: dot-images, dataClass: derived-user-visible, strategy: retained, schemaVersion: '1' }
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
