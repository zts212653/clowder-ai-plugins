pluginId: official.tripo-studio
version: 0.2.0
contractVersion: 0.1.0
name: Tripo Studio
description: 分享链接后台审模、候选多角度比较与已选模型回流。分享页无需登录；连接已登录 Chrome 时单独明确授权。生成与正式导出需要额外明确授权；生成会消耗网页订阅积分。不调用另付费 API，不购买或升级。
icon:
  type: svg
  src: assets/tripo-studio.svg
configuration:
  - key: chromeConnection
    label: 本机组件
    kind: operation
    required: false
    actions:
      - id: status
        label: 刷新状态
        render: button
        action:
          method: tripo.status
features:
  - id: model-review
    name: 后台审模与资产回流
    resources: []
    contributions:
      - type: mcp
        id: tripo-studio
contributions:
  - type: mcp
    id: tripo-studio
    runtime:
      transport: stdio
      entrypoint: plugins/tripo-studio/runtime/mcp.mjs
data:
  - name: model-provenance
    dataClass: derived-user-visible
    strategy: retained
    schemaVersion: "1"
  - name: chrome-authorization
    dataClass: relationship
    strategy: retained
    schemaVersion: "1"
runtime:
  transport: builtin
  entrypoint: plugins/tripo-studio/runtime/plugin-entrypoint.mjs
