pluginId: official.collective-connector
version: 0.1.0-alpha.22
contractVersion: 0.2.0
name: Collective
description:
  default: Collective service and web client managed by the plugin.
  translations:
    zh-CN: 插件管理的 Collective 服务与网页客户端。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: serviceMode
    label: Run mode
    kind: select
    required: true
    default: embedded
    description: Choose where the Service runs. Save, then disable and enable this plugin to apply changes. Existing connections and local Service data are retained.
    options:
      - value: embedded
        label: Run on this computer
        hint: This computer runs and stores the Collective Service.
      - value: remote
        label: Connect to remote
        hint: The Service runs elsewhere. This computer connects through SSH.
  - key: servicePort
    label: Local Service port
    kind: string
    required: false
    default: "5201"
    description: Loopback listener owned by this plugin. Ports 3001 and 3002 are reserved for Café.
  - key: remoteServiceUrl
    label: Remote Service address
    kind: url
    required: true
    default: http://127.0.0.1:15201
    description: The local end of your SSH tunnel. Use the same address for the browser, pairing and login callbacks.
  - key: calendar
    label: Current public Work dates
    kind: operation
    required: false
    actions:
      - id: read
        label: Read original Work dates
        render: status
        resultRender: status
        action: { method: collective.work.owner.calendar }
  - key: service
    label: Service status
    kind: operation
    required: false
    actions:
      - id: status
        label: Service status
        render: button
        action:
          method: collective.service.status
  - key: recovery
    label: Verify held local operations
    kind: operation
    required: false
    actions:
      - id: list
        label: Held operations
        render: status
        resultRender: rows
        action:
          method: collective.recovery.list
      - id: page
        label: More held operations
        render: row
        resultRender: rows
        action:
          method: collective.recovery.page
      - id: reconcile
        label: Verify result
        render: row
        resultRender: rows
        action:
          method: collective.recovery.reconcile
      - id: resume
        label: Resume this verified operation once
        render: row
        resultRender: rows
        confirm: Resume the same operation once using its verified recovery proof?
        action:
          method: collective.recovery.resume
  - key: participation
    label: Collective participation
    kind: operation
    required: false
    actions:
      - id: list
        label: Paired connections
        render: button
        resultRender: rows
        action: { method: collective.owner.connections }
      - id: sync
        label: Sync this connection and admit its named requests
        render: row
        resultRender: rows
        action: { method: collective.owner.sync }
  - key: work
    label: Private Collective Work
    kind: operation
    required: false
    actions:
      - id: list
        label: Paired Work connections
        render: button
        resultRender: rows
        action: { method: collective.work.owner.connections }
      - id: sync
        label: Admit current committed Work
        render: row
        resultRender: rows
        action: { method: collective.work.owner.sync }
      - id: result-attention
        label: Current returned results
        render: button
        resultRender: status
        action: { method: collective.work.owner.result-attention }
      - id: adopt-task
        label: Let this Collective installation maintain the original Task
        render: row
        resultRender: rows
        confirm: Keep the original Task and let this installed Collective maintain its data until you revoke it?
        action: { method: collective.work.owner.adopt-task }
      - id: revoke-task
        label: Revoke Collective Task maintenance
        render: row
        resultRender: rows
        confirm: Revoke this Collective installation's ability to maintain the original Task data?
        action: { method: collective.work.owner.revoke-task }
  - key: accountability
    label: Collective accountability
    kind: operation
    required: false
    actions:
      - id: attention
        label: Pending responsibility requests
        render: button
        resultRender: status
        action: { method: collective.owner.accountability-attention }
configurationVariants:
  discriminator: serviceMode
  branches:
    - id: embedded
      when:
        properties: { serviceMode: { const: embedded } }
      fields: [servicePort]
    - id: remote
      when:
        properties: { serviceMode: { const: remote } }
      fields: [remoteServiceUrl]
steps:
  - text: Open Collective and follow the initial account setup.
    mode: embedded
  - text: Install the independent Service on the remote computer, listening only on 127.0.0.1:5201.
    mode: remote
  - text: "Keep the local SSH tunnel running: ssh -N -T -L 127.0.0.1:15201:127.0.0.1:5201 <SSH destination>"
    mode: remote
  - text: Save, disable and enable the plugin, then open Collective to sign in and pair this Café.
    mode: remote
features:
  - id: collective-backend
    name: Collective backend
    resources: []
    contributions:
      - type: webhook
        id: collective-owner-10
      - type: webhook
        id: collective-owner-11
      - type: webhook
        id: collective-owner-12
      - type: webhook
        id: collective-owner-13
      - type: webhook
        id: collective-owner-18
      - type: webhook
        id: collective-owner-19
      - type: webhook
        id: collective-owner-20
      - type: webhook
        id: collective-owner-22
      - type: webhook
        id: collective-owner-23
      - type: webhook
        id: collective-owner-24
      - type: webhook
        id: collective-owner-31
      - type: webhook
        id: collective-entry-roster
      - type: webhook
        id: collective-pair
      - type: webhook
        id: collective-participation-policy
      - type: webhook
        id: collective-participation-view
      - type: webhook
        id: collective-participation-reconcile
      - type: webhook
        id: collective-media-context
      - type: webhook
        id: collective-media-retained
      - type: webhook
        id: collective-media-share
      - type: webhook
        id: collective-media-read
      - type: identity
        id: collective
      - type: skill
        id: collective-participation
      - type: mcp
        id: collective-owner-native
      - type: mcp
        id: collective-native
  - id: collective-work
    name: Private Collective Work
    resources: []
    contributions:
      - { type: mcp, id: collective-work-native }
      - { type: message-subscription, id: collective-work-materials }
      - { type: webhook, id: collective-work-admit }
      - { type: webhook, id: collective-work-resume }
      - { type: webhook, id: collective-work-result-accepted }
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
  dataDirectory: collective
contributions:
  - type: skill
    id: collective-participation
    path: skills/collective-participation
  - type: identity
    id: collective
    displayName: Collective
  - type: mcp
    id: collective-native
    runtime: { transport: stdio, entrypoint: dist/mcp-entrypoint.js }
  - type: webhook
    id: collective-owner-10
    path: connections
    methods: [ GET ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-11
    path: connections/:connectionId/inbox
    methods: [ GET ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-12
    path: connections/:connectionId/listening
    methods: [ GET ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-13
    path: connections/:connectionId/listening
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-18
    path: connections/:connectionId/reconnect
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-19
    path: connections/:connectionId/revoke
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-20
    path: connections/:connectionId/route
    methods: [ GET, PUT ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-22
    path: connections/:connectionId/work-policy
    methods: [ GET ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-23
    path: connections/:connectionId/work-policy/adopt
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-24
    path: connections/:connectionId/work-policy/revoke
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-owner-31
    path: service/provision
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-entry-roster
    path: entry-roster
    methods: [ GET ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-pair
    path: pair
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-participation-reconcile
    path: connections/:connectionId/participation/reconcile
    methods: [ POST ]
    action: { method: collective.control.http }
  - type: webhook
    id: collective-participation-policy
    path: connections/:connectionId/participation/policy
    methods: [ PUT ]
    action: { method: collective.control.http }
  - type: mcp
    id: collective-owner-native
    runtime: { transport: stdio, entrypoint: dist/owner-mcp-entrypoint.js }
  - type: webhook
    id: collective-participation-view
    path: connections/:connectionId/participation
    methods: [ GET, PUT ]
    action: { method: collective.control.http }

  - type: message-subscription
    id: collective-work-materials
    binding: collective
    action: { method: collective.work.material.receive }
    presentation: v1
  - type: mcp
    id: collective-work-native
    runtime: { transport: stdio, entrypoint: dist/work-mcp-entrypoint.js }
  - type: webhook
    id: collective-work-admit
    path: connections/:connectionId/work/admit
    methods: [ POST ]
    action: { method: collective.work.control.http }
  - type: webhook
    id: collective-work-resume
    path: connections/:connectionId/work/resume
    methods: [ POST ]
    action: { method: collective.work.control.http }
  - type: webhook
    id: collective-work-result-accepted
    path: connections/:connectionId/work/result/accepted
    methods: [ POST ]
    action: { method: collective.work.control.http }

  - type: webhook
    id: collective-media-context
    path: connections/:connectionId/artifacts/share-media/context
    methods: [ POST ]
    action: { method: collective.media.http }

  - type: webhook
    id: collective-media-retained
    path: connections/:connectionId/artifacts/retained-media
    methods: [ GET ]
    action: { method: collective.media.http }

  - type: webhook
    id: collective-media-share
    path: connections/:connectionId/artifacts/share-media
    methods: [ POST ]
    action: { method: collective.media.http }

  - type: webhook
    id: collective-media-read
    path: connections/:connectionId/artifacts/:artifactId/media/:ownerRevision
    methods: [ GET ]
    action: { method: collective.media.http }
