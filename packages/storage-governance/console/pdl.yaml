ns: storageGovernance
inserts:
  - id: storage-governance
    anchor: nav.cafe
    at: inside
    node:
      title: t:storageGovernance.entry
      icon: box
      sources:
        scanStatus: scanStatus
      activity: '@scanStatus.activity'
      open:
        node: storageGovernance.page
        anchor: shell
        as: cover
        backLabel: true
views:
  storageGovernance.page:
    blocks:
      - type: component
        use: plugin:official.storage-governance/themed-frame
        props:
          html:
            request: page
          title: t:storageGovernance.title
    title: t:storageGovernance.title
    loading: t:storageGovernance.loading
    error: t:storageGovernance.error
requests:
  page:
    path: panel
  scanStatus:
    path: scan
    query:
      view: status
    refreshMs: 5000
