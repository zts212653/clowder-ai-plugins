pluginId: dev.clowder.xiangqi
version: 0.1.0-alpha.3
contractVersion: 0.1.0
name: Xiangqi
description:
  default: Play Chinese chess with the cat in your conversation, or analyze a position.
  translations:
    zh-CN: 和当前对话里的猫下一盘象棋，也可以单独分析局面。
icon:
  type: svg
  src: assets/icon.svg
contributions:
  - type: identity
    id: xiangqi
    displayName: 象棋棋桌
  - type: webhook
    id: xiangqi-owner-board
    path: board/:gameId
    methods: [ GET ]
    action: { method: xiangqi.launch }
  - type: mcp
    id: xiangqi-analysis
    runtime:
      transport: stdio
      entrypoint: dist/mcp-entrypoint.mjs
features:
  - id: analyze-position
    name: Play and analyze Xiangqi
    resources: []
    contributions:
      - type: mcp
        id: xiangqi-analysis
      - type: identity
        id: xiangqi
      - type: webhook
        id: xiangqi-owner-board
data:
  - name: games
    dataClass: user-authored
    strategy: retained
  - name: analyses
    dataClass: derived-user-visible
    strategy: retained
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.mjs
  dataDirectory: xiangqi
