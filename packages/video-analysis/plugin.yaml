pluginId: dev.clowder.video-analysis
version: 0.1.0-alpha.4
contractVersion: 0.1.0
name: Video Analysis
description:
  default: Send one remote HTTPS video URL and a prompt to the configured provider for analysis.
  translations:
    zh-CN: 将一个远程 HTTPS 视频 URL 和提示词交给已配置的提供商分析。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: provider
    label: 视频协议
    kind: select
    required: true
    options:
      - value: gemini
        label: Gemini
        hint: 在 Google AI Studio 获取 API Key
        docsUrl: https://ai.google.dev/gemini-api/docs
      - value: zhipu
        label: 智谱
        hint: 在智谱开放平台注册，获取 API Key
        docsUrl: https://docs.bigmodel.cn/cn/guide/models/vlm
  - key: authType
    label: 认证方式
    kind: select
    required: true
    options:
      - value: apikey
        label: API Key
      - value: query-param
        label: Query Parameter
  - key: apiKey
    label: API Key
    kind: secret
    required: true
  - key: baseUrl
    label: Base URL
    kind: url
    required: false
  - key: model
    label: 模型名称
    kind: string
    required: false
contributions:
  - type: mcp
    id: video-analysis-toolset
    runtime:
      transport: stdio
      entrypoint: dist/mcp-entrypoint.js
    environment:
      VIDEO_ANALYSIS_PROVIDER:
        source: config
        key: provider
      VIDEO_ANALYSIS_AUTH_TYPE:
        source: config
        key: authType
      VIDEO_ANALYSIS_API_KEY:
        source: secret
        key: apiKey
      VIDEO_ANALYSIS_BASE_URL:
        source: config
        key: baseUrl
      VIDEO_ANALYSIS_MODEL:
        source: config
        key: model
features:
  - id: analyze-video
    name: Analyze video
    resources: []
    contributions:
      - type: mcp
        id: video-analysis-toolset
runtime:
  transport: builtin
