pluginId: official.connector.telegram
version: 0.1.0-alpha.8
contractVersion: 0.1.0
name: Telegram Connector
description:
  default: Receive and send Telegram Bot messages through a Host-owned connector binding.
  translations:
    zh-CN: 通过宿主所有的连接器绑定接收和发送 Telegram Bot 消息。
icon:
  type: svg
  src: assets/icon.svg
configuration:
  - key: botToken
    label: Bot Token
    kind: secret
    required: true
test:
  action:
    method: telegram.test
steps:
  - text: 在 Telegram 中找到 @BotFather，发送 /newbot 创建机器人
  - text: 复制生成的 Bot Token
contributions:
  - type: identity
    id: telegram-bot
    displayName: Telegram bot
  - type: message-subscription
    id: telegram
    binding: telegram-bot
    action:
      method: telegram.outbound
    presentation: v1
  - type: media-source
    id: telegram-media
    binding: telegram-bot
features:
  - id: telegram-messaging
    name: Telegram messaging
    resources: []
    contributions:
      - type: identity
        id: telegram-bot
      - type: message-subscription
        id: telegram
      - type: media-source
        id: telegram-media
runtime:
  transport: builtin
  entrypoint: dist/plugin-entrypoint.js
